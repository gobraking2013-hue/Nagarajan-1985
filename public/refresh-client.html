<!-- Live refresh button for employees (add into your topbar area) -->
<button id="liveRefreshBtn" class="btn" onclick="fetchLiveKpiData()" style="margin-left:8px;padding:6px 10px;font-size:11px;">🔄 Refresh Live</button>

<script>
async function fetchLiveKpiData() {
  try {
    const url = 'https://raw.githubusercontent.com/gobraking2013-hue/Nagarajan-1985/main/kpi-data.json?t=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    localStorage.setItem('kpiData', JSON.stringify(data));
    if (typeof displayEmployees === 'function') {
      try { displayEmployees(); } catch (e) { console.warn('displayEmployees error', e); }
    }
    const s = document.getElementById('userStatus');
    if (s) s.textContent = 'Live data refreshed: ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error(err);
    alert('Live refresh failed: ' + err.message);
  }
}
</script>
